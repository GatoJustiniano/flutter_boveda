# Publica el APK en GitHub Releases al subir una etiqueta de versión.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Secretos requeridos (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    contenido del .jks codificado en base64
#   ANDROID_KEYSTORE_PASSWORD  contraseña del keystore
#   ANDROID_KEY_ALIAS          alias de la llave (ej. boveda)
#   ANDROID_KEY_PASSWORD       contraseña de la llave
name: Publicar APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # necesario para crear el Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar que la etiqueta coincide con pubspec.yaml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::La etiqueta v$TAG no coincide con 'version: $PUBSPEC' en pubspec.yaml"
            exit 1
          fi

      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. No se publica un APK sin firma propia."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Compilar APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          OUT=build/app/outputs/flutter-apk
          V="${GITHUB_REF_NAME}"
          mkdir dist
          cp "$OUT/app-arm64-v8a-release.apk"   "dist/Boveda-$V-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "dist/Boveda-$V-armv7.apk"
          cp "$OUT/app-release.apk"             "dist/Boveda-$V-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Borrar llave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Descarga
            - **Boveda-${{ github.ref_name }}-arm64.apk** → la mayoría de celulares (2017 en adelante). **Recomendado.**
            - **Boveda-${{ github.ref_name }}-armv7.apk** → celulares antiguos de 32 bits.
            - **Boveda-${{ github.ref_name }}-universal.apk** → si no sabes cuál elegir (más pesado).

            Requiere Android 7.0 o superior. Al instalar, Android pedirá permitir "instalar apps de fuentes desconocidas".
            `SHA256SUMS.txt` permite verificar que el archivo no fue modificado.
