name: boveda
description: "Bóveda de Suscripciones - Gestiona tus cuentas y servicios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_logo.png

# Ícono de la app. Regenerar con: dart run flutter_launcher_icons
# Los PNG salen de assets/icon/logo_lagarrita.svg (patita ubicada dentro de la
# zona segura del ícono adaptativo de Android).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFF0F8"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
